# Sentinel Fire Detection System - Detection Configuration

detection:
  thresholds:
    immediate_alert: 0.95    # P1 - Critical: Immediate dispatch / high-priority alert
    review_queue: 0.85       # P2 - Warning: Human verification queue
    log_only: 0.70           # P4 - Notice: Informational / data collection logging
  
  environmental:
    fog_adjustment: -0.05    # Reduce sensitivity in low-visibility or foggy conditions
    sunset_hours: [17, 19]   # Dynamic threshold compensation during challenging twilight angles
    
  adaptive:
    enabled: true
    learning_window_days: 7
    max_auto_adjustment: 0.05

cameras:
  max_concurrent: 10         # Maximum concurrent RTSP feeds processed in parallel
  rtsp_timeout: 5            # Seconds before stream reconnect attempt
  frame_rate: 2              # Processing inference rate (FPS per feed)

system:
  detection_latency_target: 2.0  # Maximum target latency from frame capture to alert (seconds)
  log_retention_days: 30
  video_retention_hours: 48
  
alerts:
  enabled: true
  sms_enabled: false         # Requires Twilio / SMS credentials
  email_enabled: false       # Requires SMTP server configuration
  desktop_notifications: true
