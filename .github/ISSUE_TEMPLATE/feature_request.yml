name: Feature Request
description: Suggest an idea or enhancement for Sentinel
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest an improvement or new feature for the Sentinel Fire Detection System.
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or specific deployment scenario?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Architecture
      description: Describe your proposed solution or how you envision the feature working.
    validations:
      required: true
