name: Bug Report
description: Create a report to help us improve Sentinel
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please ensure you are running the latest version of Sentinel before reporting.
  - type: input
    id: environment
    attributes:
      label: Operating System & Hardware
      description: What OS, CPU, and GPU (if any) are you running on?
      placeholder: e.g., Ubuntu 22.04 LTS, Intel i7-12700, NVIDIA RTX 3060
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Paste any relevant logs from `/var/log/sentinel/sentinel.log` or console output.
      render: shell
